<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Poker — Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/room.css">
</head>
<body>

  <!-- Name entry overlay -->
  <div id="nameOverlay" class="overlay">
    <div class="overlay-card">
      <h2>What's your name?</h2>
      <input id="nameInput" type="text" placeholder="Your name" maxlength="12" class="name-input" autofocus>
      <div class="name-buttons">
        <button id="nameBtn" class="btn btn-primary">Join</button>
        <button id="randomNameBtn" class="btn btn-random">Random</button>
      </div>
      <p id="nameError" class="error-text"></p>
    </div>
  </div>

  <!-- Top bar -->
  <div class="top-bar">
    <a href="/" class="logo">Planning Poker</a>
    <div class="top-bar-right">
      <button id="copyLinkBtn" class="btn btn-small" title="Copy invite link">Copy Link</button>
      <span id="roomIdLabel" class="room-id"></span>
    </div>
  </div>

  <!-- Room scene -->
  <div class="room-wrapper">
    <div id="room" class="room">
      <!-- Loading screen -->
      <div id="loadingScreen" class="loading-screen">
        <div id="hourglass" class="hourglass"></div>
        <div class="loading-text">Connecting...</div>
      </div>

      <!-- Furniture rendered by CSS -->
      <div class="poker-table">
        <span class="table-slogan">ESTIMATE. DEBATE. ITERATE.</span>
        <button id="tableCardsBtn" class="table-cards-btn">PICK CARDS</button>
      </div>
      <div class="whiteboard"><span id="whiteboardText">Pick your cards!</span></div>
      <div class="plant"></div>
      <div class="plant-tall"></div>
      <div class="plant-small"></div>
      <div class="water-cooler"></div>
      <div class="bookshelf"></div>
      <div class="clock"></div>
      <div class="poster"></div>
      <div class="trash-bin"></div>
      <div class="door-frame"></div>
      <div class="couch"></div>
      <div class="rug"></div>
      <div class="kitchen">
        <div class="kitchen-counter"></div>
        <div class="kitchen-shelf"></div>
        <div class="coffee-machine"></div>
        <div class="coffee-steam"></div>
        <div class="kitchen-mug1"></div>
        <div class="kitchen-mug2"></div>
      </div>

      <!-- Seat slots — positioned by JS around the poker table -->
      <div class="seat-slot" data-seat="0"></div>
      <div class="seat-slot" data-seat="1"></div>
      <div class="seat-slot" data-seat="2"></div>
      <div class="seat-slot" data-seat="3"></div>
      <div class="seat-slot" data-seat="4"></div>
      <div class="seat-slot" data-seat="5"></div>
      <div class="seat-slot" data-seat="6"></div>
      <div class="seat-slot" data-seat="7"></div>
      <div class="seat-slot" data-seat="8"></div>
      <div class="seat-slot" data-seat="9"></div>
      <div class="seat-slot" data-seat="10"></div>
      <div class="seat-slot" data-seat="11"></div>
      <div class="seat-slot" data-seat="12"></div>
      <div class="seat-slot" data-seat="13"></div>
      <div class="seat-slot" data-seat="14"></div>
      <div class="seat-slot" data-seat="15"></div>
      <div class="seat-slot" data-seat="16"></div>
      <div class="seat-slot" data-seat="17"></div>
      <div class="seat-slot" data-seat="18"></div>
      <div class="seat-slot" data-seat="19"></div>
    </div>
  </div>

  <!-- Side panel: cards + host controls -->
  <div id="sidePanel" class="side-panel">
    <button id="panelToggle" class="panel-toggle">CARDS</button>
    <div class="panel-content">
      <div id="hostControls" class="host-controls hidden">
        <button id="revealBtn" class="btn btn-reveal">Reveal Votes</button>
        <button id="resetBtn" class="btn btn-reset hidden">New Round</button>
      </div>
      <div class="card-grid">
        <button class="card" data-value="0">0</button>
        <button class="card" data-value="1">1</button>
        <button class="card" data-value="2">2</button>
        <button class="card" data-value="3">3</button>
        <button class="card" data-value="5">5</button>
        <button class="card" data-value="8">8</button>
        <button class="card" data-value="13">13</button>
        <button class="card" data-value="21">21</button>
        <button class="card" data-value="?">?</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/room.js"></script>
</body>
</html>
